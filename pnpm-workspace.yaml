packages:
  - apps/web

# Keep the optional menus on the editor's patched release: their broad peer
# ranges otherwise select a different Tiptap minor and break peer consistency.
overrides:
  '@tiptap/react@3.30.5>@tiptap/extension-bubble-menu': 3.30.5
  '@tiptap/react@3.30.5>@tiptap/extension-floating-menu': 3.30.5
