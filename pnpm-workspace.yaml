packages:
  - apps/web

# Keep the optional menus on the editor's patched release: their broad peer
# ranges otherwise select a different Tiptap minor and break peer consistency.
overrides:
  '@tiptap/react@3.35.0>@tiptap/extension-bubble-menu': 3.35.0
  '@tiptap/react@3.35.0>@tiptap/extension-floating-menu': 3.35.0
  '@tailwindcss/node>source-map-js': 1.2.4
