[package]
name = "imyemail-manager"
version = "1.3.24"
edition = "2024"
rust-version = "1.98"
publish = false

[[bin]]
name = "imyemail"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive", "env"] }
fs2 = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tiny_http = "0.12"
url = "2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
