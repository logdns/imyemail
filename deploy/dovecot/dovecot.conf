dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols = imap pop3 lmtp
listen = *
base_dir = /var/run/dovecot/

log_path = /dev/stderr
info_log_path = /dev/stdout

ssl = yes
ssl_server_cert_file = /etc/ssl/certs/ssl-cert-snakeoil.pem
ssl_server_key_file = /etc/ssl/private/ssl-cert-snakeoil.key

mail_home = /var/mail/vhosts/%{user | domain}/%{user | username}
mail_driver = maildir
mail_path = %{home}/Maildir
mail_max_userip_connections = 10
recipient_delimiter = +

quota_driver = count
quota_storage_size = 1G

auth_policy_server_url = http://127.0.0.1:8080/auth-policy
auth_policy_server_api_header = Content-Type: application/json
auth_policy_hash_mech = sha256
auth_policy_hash_truncate = 12
auth_policy_hash_nonce = __IMYEMAIL_AUTH_POLICY_HASH_NONCE__
auth_policy_request_attributes {
  login = %{requested_username}
  remote = %{remote_ip}
  device_id = %{client_id}
  protocol = %{protocol}
}
auth_policy_check_before_auth = yes
auth_policy_check_after_auth = no
auth_policy_report_after_auth = yes
imap_id_retain = yes

namespace inbox {
  inbox = yes
  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }
  mailbox Archive {
    auto = subscribe
    special_use = \Archive
  }
  mailbox Spam {
    auto = subscribe
    special_use = \Junk
  }
}

!include /etc/dovecot/dovecot-sql.conf.ext

protocol imap {
  mail_plugins = quota imap_quota
}

protocol pop3 {
  mail_plugins = quota
}

service imap-login {
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

service pop3-login {
  inet_listener pop3s {
    port = 995
    ssl = yes
  }
}

service lmtp {
  inet_listener lmtp {
    listen = 0.0.0.0
    port = 24
  }
}

service auth {
  inet_listener postfix-auth {
    listen = 0.0.0.0
    port = 12345
  }
}

protocol lmtp {
  postmaster_address = postmaster@localhost
  recipient_delimiter = +
  lda_mailbox_autocreate = yes
  lmtp_save_to_detail_mailbox = yes
}
