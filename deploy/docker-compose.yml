services:
  imyemail:
    image: ${IMYEMAIL_IMAGE:-ghcr.io/logdns/imyemail:latest}
    env_file: .env
    environment:
      IMYEMAIL_UPDATE_SERVICE_URL: http://updater:8080/v1/update
      IMYEMAIL_UPDATE_SERVICE_TOKEN: ${IMYEMAIL_UPDATE_TOKEN:-}
    ports:
      - "${IMYEMAIL_HTTP_BIND:-80}:80"
      - "${IMYEMAIL_HTTPS_BIND:-443}:443"
      - "${IMYEMAIL_SMTP_BIND:-25}:25"
      - "${IMYEMAIL_SMTPS_BIND:-465}:465"
      - "${IMYEMAIL_SUBMISSION_BIND:-587}:587"
      - "${IMYEMAIL_IMAPS_BIND:-993}:993"
      - "${IMYEMAIL_POP3S_BIND:-995}:995"
    volumes:
      - ./data:/data
      - ./mail:/var/mail/vhosts
      - ./dkim:/var/lib/rspamd/dkim
      # 生产环境如需第三方客户端校验证书，请取消下面挂载，并在 .env 配置：
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: "imyemail"
    stop_grace_period: 30s
    restart: unless-stopped

  updater:
    image: nickfedor/watchtower:1.20.2
    environment:
      WATCHTOWER_HTTP_API_TOKEN: ${IMYEMAIL_UPDATE_TOKEN:?请在 .env 设置 IMYEMAIL_UPDATE_TOKEN}
    command:
      - --http-api-endpoints
      - update
      - --label-enable
      - --scope
      - imyemail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
