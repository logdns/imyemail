name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/release.yml"
      - ".ai-reviewignore"
      - "LICENSE"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/release.yml"
      - ".ai-reviewignore"
      - "LICENSE"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mail-stack:
    name: Verify mail stack (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Read candidate version
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
      - name: Build native mail stack and run upstream tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/all-in-one/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          pull: true
          tags: imyemail:ci
          cache-from: type=gha,scope=release-all-in-one-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-all-in-one-${{ matrix.arch }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.tag }}
            APP_COMMIT=${{ github.sha }}
            VITE_APP_VERSION=${{ steps.version.outputs.tag }}
            VITE_RELEASE_URL=https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}
            VITE_ASSET_BASE=https://cdn.jsdelivr.net/gh/${{ github.repository }}@${{ steps.version.outputs.tag }}/apps/web/dist/
      - name: Verify protocols, authorization and Maildir compatibility
        run: python3 deploy/tests/check-mail-stack.py --image imyemail:ci --previous-image ghcr.io/logdns/imyemail:v1.3.24

  checks:
    name: Check web, APIs, and manager
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.23.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile --filter imyemail-web...

      - name: Check shadcn/ui usage
        run: pnpm --dir apps/web run check:shadcn

      - name: Check UI templates
        run: pnpm --dir apps/web run check:templates

      - name: Check UI translations
        run: pnpm --dir apps/web run check:i18n

      - name: Check editor security regressions
        run: pnpm --dir apps/web run check:editor-security

      - name: Check Pages source
        run: |
          node --check site/i18n.js
          node --check site/app.js
          node site/check-i18n.mjs

      - name: Build web
        run: pnpm --dir apps/web run build

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Test api
        working-directory: apps/api
        run: go test ./...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy

      - name: Check Rust API formatting
        working-directory: apps/api-rs
        run: cargo fmt --check

      - name: Lint Rust API
        working-directory: apps/api-rs
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test Rust API
        working-directory: apps/api-rs
        run: cargo test --locked

      - name: Check Rust manager formatting
        working-directory: apps/manager
        run: cargo fmt --check

      - name: Lint Rust manager
        working-directory: apps/manager
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test Rust manager
        working-directory: apps/manager
        run: cargo test --locked

      - name: Validate bootstrap scripts
        run: |
          for script in install.sh deploy/install.sh deploy/dovecot/run-test.sh; do bash -n "$script" || exit 1; done
          for script in deploy/dovecot/build-source.sh deploy/dovecot/check-source.sh deploy/postfix/build-source.sh; do sh -n "$script" || exit 1; done
          python3 -m py_compile deploy/tests/check-mail-stack.py

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Validate Dockerfiles
        run: |
          docker buildx build --check --file deploy/api.Dockerfile .
          docker buildx build --check --file deploy/api-rust.Dockerfile .
          docker buildx build --check --file deploy/web.Dockerfile .
          docker buildx build --check --file deploy/all-in-one/Dockerfile .
          docker buildx build --check --file deploy/operator/Dockerfile .
          docker buildx build --check --file deploy/nginx/Dockerfile deploy/nginx
          docker buildx build --check --file deploy/postfix/Dockerfile deploy/postfix
          docker buildx build --check --file deploy/dovecot/Dockerfile deploy/dovecot
          docker buildx build --check --file deploy/rspamd/Dockerfile deploy/rspamd

      - name: Validate Compose configurations
        env:
          IMYEMAIL_UPDATE_TOKEN: ci-validation-token-000000000000000000000000
          IMYEMAIL_INSTALL_DIR: /opt/imyemail
        run: |
          install -m 0600 deploy/.env.example deploy/.env
          docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml config --quiet
          docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml -f deploy/docker-compose.build.yml config --quiet
          docker compose --env-file deploy/.env.example -f deploy/docker-compose.stack.yml config --quiet
          docker compose --env-file deploy/.env.example -f deploy/docker-compose.stack.yml -f deploy/docker-compose.stack.build.yml config --quiet
          docker compose --env-file deploy/.env.example -f deploy/docker-compose.stack.yml -f deploy/docker-compose.stack.rust.yml config --quiet
