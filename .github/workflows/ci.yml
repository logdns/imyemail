name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/release.yml"
      - ".ai-reviewignore"
      - "LICENSE"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/release.yml"
      - ".ai-reviewignore"
      - "LICENSE"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Check web, APIs, and manager
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile --filter imyemail-web...

      - name: Check shadcn/ui usage
        run: pnpm --dir apps/web run check:shadcn

      - name: Check UI templates
        run: pnpm --dir apps/web run check:templates

      - name: Check UI translations
        run: pnpm --dir apps/web run check:i18n

      - name: Build web
        run: pnpm --dir apps/web run build

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Test api
        working-directory: apps/api
        run: go test ./...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
          components: rustfmt, clippy

      - name: Check Rust API formatting
        working-directory: apps/api-rs
        run: cargo fmt --check

      - name: Lint Rust API
        working-directory: apps/api-rs
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test Rust API
        working-directory: apps/api-rs
        run: cargo test --locked

      - name: Check Rust manager formatting
        working-directory: apps/manager
        run: cargo fmt --check

      - name: Lint Rust manager
        working-directory: apps/manager
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test Rust manager
        working-directory: apps/manager
        run: cargo test --locked

      - name: Validate bootstrap scripts
        run: bash -n install.sh deploy/install.sh

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate Dockerfiles
        run: |
          docker buildx build --check --file deploy/api.Dockerfile .
          docker buildx build --check --file deploy/api-rust.Dockerfile .
          docker buildx build --check --file deploy/web.Dockerfile .
          docker buildx build --check --file deploy/all-in-one/Dockerfile .
          docker buildx build --check --file deploy/operator/Dockerfile .
          docker buildx build --check --file deploy/nginx/Dockerfile deploy/nginx
          docker buildx build --check --file deploy/postfix/Dockerfile deploy/postfix
          docker buildx build --check --file deploy/dovecot/Dockerfile deploy/dovecot
          docker buildx build --check --file deploy/rspamd/Dockerfile deploy/rspamd

      - name: Validate Compose configurations
        env:
          IMYEMAIL_UPDATE_TOKEN: ci-validation-token-000000000000000000000000
          IMYEMAIL_INSTALL_DIR: /opt/imyemail
        run: |
          install -m 0600 deploy/.env.example deploy/.env
          docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml config --quiet
          docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml -f deploy/docker-compose.build.yml config --quiet
          docker compose --env-file deploy/.env.example -f deploy/docker-compose.stack.yml config --quiet
          docker compose --env-file deploy/.env.example -f deploy/docker-compose.stack.yml -f deploy/docker-compose.stack.build.yml config --quiet
          docker compose --env-file deploy/.env.example -f deploy/docker-compose.stack.yml -f deploy/docker-compose.stack.rust.yml config --quiet
