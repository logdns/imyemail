name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/release.yml"
      - ".ai-reviewignore"
      - "LICENSE"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/release.yml"
      - ".ai-reviewignore"
      - "LICENSE"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Check web, APIs, and manager
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile --filter imyemail-web...

      - name: Check shadcn/ui usage
        run: pnpm --dir apps/web run check:shadcn

      - name: Build web
        run: pnpm --dir apps/web run build

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Test api
        working-directory: apps/api
        run: go test ./...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
          components: rustfmt, clippy

      - name: Check Rust API formatting
        working-directory: apps/api-rs
        run: cargo fmt --check

      - name: Lint Rust API
        working-directory: apps/api-rs
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test Rust API
        working-directory: apps/api-rs
        run: cargo test --locked

      - name: Check Rust manager formatting
        working-directory: apps/manager
        run: cargo fmt --check

      - name: Lint Rust manager
        working-directory: apps/manager
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test Rust manager
        working-directory: apps/manager
        run: cargo test --locked

      - name: Validate bootstrap scripts
        run: bash -n install.sh deploy/install.sh
